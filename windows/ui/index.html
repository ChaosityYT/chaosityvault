<!doctype html>
<html><head><meta charset="utf-8"><title>Chaosity Vault</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src https://media.ihateposting.com; img-src 'self' https://media.ihateposting.com data:">
<style>
:root{--bg:#0e0f12;--panel:#17191e;--panel2:#20232a;--line:#2b2f37;--text:#eceef2;--dim:#9aa1ad;--red:#e5262b;--green:#2fbf71;--amber:#e8a33d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 14px 0 0}
nav button{background:none;border:0;color:var(--dim);padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit}
nav button.on{background:var(--panel2);color:var(--text)}
.sp{flex:1}.pill{padding:3px 10px;border-radius:99px;font-size:12px;background:var(--panel2);color:var(--dim)}.pill.g{color:#07140c;background:var(--green)}.pill.r{color:#fff;background:var(--red)}.pill.a{color:#1b1204;background:var(--amber)}
main{padding:16px;max-width:1300px;margin:auto}
button.b{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit}button.b:hover{border-color:#4a505c}button.p{background:var(--red);border-color:var(--red);color:#fff}button.d{color:#ff8a8d}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.day{margin:18px 0 6px;font-weight:600;color:var(--dim);font-size:13px}
.post{display:grid;grid-template-columns:76px 130px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px}
.post .t{font-weight:600}.post .c{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.err{color:#ff8a8d;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.card video,.card img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
.card .i{padding:8px 10px;font-size:12px;color:var(--dim);flex:1}.card .n{color:var(--text);font-size:12.5px;word-break:break-word;margin-bottom:3px}.card .a{padding:0 10px 10px;display:flex;gap:6px}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden;width:240px}.bar i{display:block;height:100%;background:var(--red)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--dim);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px;font:inherit}
input[type=text].title{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-size:12.5px}.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:14px}.box h3{margin:0 0 8px;font-size:14px}
.log{font:12px/1.5 Consolas,monospace;color:var(--dim);white-space:pre-wrap;max-height:380px;overflow:auto}
.banner{background:#3a1416;border:1px solid #6e2226;padding:10px 14px;border-radius:9px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.empty{color:var(--dim);padding:30px;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.vc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;display:block;width:100%}.vc:hover{border-color:#4a505c}
.vc img,.vc .noimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}.vc .i{padding:10px 12px}.vc .n{font-weight:600;margin-bottom:3px}.vc .s{color:var(--dim);font-size:12.5px;margin-bottom:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.big{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two textarea{width:100%;height:76px;text-transform:uppercase}
.full{width:100%}textarea.full{display:block}.count{color:var(--dim);font-size:12px}.dim{color:var(--dim);font-size:12.5px}
.vers{display:flex;gap:6px;flex-wrap:wrap}.ver{padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font:inherit;font-size:12.5px}.ver.on{border-color:var(--red);color:var(--text)}
.alt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--dim);padding:6px 2px;cursor:pointer;font:inherit}.alt:hover{color:var(--text)}
.job{background:#2a2110;border:1px solid #6b5120;padding:10px 14px;border-radius:9px;margin-bottom:12px}.job.f{background:#3a1416;border-color:#6e2226}
code.c{background:var(--panel2);padding:3px 8px;border-radius:6px;font:13px Consolas,monospace;user-select:all}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(460px,90vw)}dialog::backdrop{background:#000a}label{display:block;margin:8px 0 3px;color:var(--dim);font-size:12.5px}dialog textarea{width:100%;height:80px}
</style></head><body>
<header><h1 id="name">Chaosity Vault</h1>
<nav id="nav"><button data-t="schedule">Schedule</button><button data-t="library">Library</button><button data-t="queue">Queue</button><button data-t="published">Published</button><button data-t="auto">Auto &amp; Setup</button></nav>
<span class="sp"></span><span id="autoPill" class="pill"></span></header>
<main id="m"></main>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body></html>
